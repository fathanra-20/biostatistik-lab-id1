    const MATERIS = {
      descriptive: {
        sections: [
          { heading: "UGD yang Tidak Bisa Mengukur Waktu Tunggunya Sendiri", body: "Minggu pertama rotasi klinik. Direktur rumah sakit masuk ke rapat pagi dan dengan bangga mengumumkan: \"Rata-rata waktu tunggu UGD kita 28 menit.\" Dokter senior memutar matanya. \"Angka itu menyesatkan,\" bisiknya. \"Coba lihat datanya.\"\n\nDia membuka data waktu tunggu kemarin: 8, 10, 12, 12, 14, 15, 15, 18, 20, 150 menit. Satu pasien menunggu dua setengah jam karena kesalahan administrasi rekam medis. Satu pencilan itu menarik mean dari sekitar 14 menit menjadi 27,4. Direktur secara teknis benar — tapi sangat menyesatkan.\n\nIni pelajaran pertamamu: angka bisa berbohong jika kamu memilih ringkasan yang salah. Mean, median, dan modus adalah tiga lensa berbeda untuk data yang sama." },
          {
            heading: "Tiga Cara Menemukan \"Nilai Tengah\"", body: "Bayangkan begini: 10 pasien datang ke klinikmu hari ini. Kamu ingin tahu seperti apa pasien \"tipikal\".", definitions: [
              { term: "Mean (x̄)", def: "Jumlahkan semua usia, bagi dengan 10. Sederhana — tapi kalau satu pasien berusia 98 tahun, tiba-tiba \"rata-rata\" jadi 45 padahal semua yang lain berusia 30-an. Mean mudah dipengaruhi pencilan." },
              { term: "Median", def: "Urutkan semua orang berdasarkan usia, pilih orang yang berdiri di tengah. Si 98 tahun tidak menggeser angka ini. Untuk data miring — biaya RS, pendapatan, lama rawat — median adalah jawaban yang jujur." },
              { term: "Modus", def: "Usia mana yang paling sering muncul? Kurang glamor, tapi penting untuk data kategorikal — seperti keluhan utama paling umum di malam Jumat." },
            ]
          },
          {
            heading: "Mengapa \"Sebaran\" Bisa Menyelamatkan Nyawa", body: "Ini skenario yang akan kamu hadapi saat residensi: dua obat tekanan darah sama-sama menurunkan sistolik 10 mmHg rata-rata. Mean identik. Dokter seniormu bertanya: \"Mana yang akan kamu resepkan?\"\n\nObat A: kebanyakan pasien turun antara 8 dan 12 mmHg. Konsisten.\nObat B: ada yang turun 25 mmHg (hipotensi berbahaya), ada yang turun 0. Rata-rata sama, keamanan sangat berbeda.\n\nItulah yang ditangkap oleh standar deviasi — konsistensi efek obat.", definitions: [
              { term: "Standar Deviasi (σ)", def: "Seberapa rapat data berkumpul di sekitar mean. σ kecil = konsisten, bisa diprediksi. σ besar = tidak stabil. Anggap saja sebagai \"skor keandalan\" datamu." },
              { term: "IQR (Rentang Interkuartil)", def: "Rentang 50% data di tengah. Mengabaikan nilai ekstrem — pasangan setia dari median. Untuk data miring, laporkan median + IQR, bukan mean + SD." },
            ]
          },
          { heading: "Membaca Bentuk Penyakit", body: "Dokter seniormu membuka dua histogram. \"Beritahu aku yang mana miring kanan.\"\n\nBayangkan kamu mengurutkan tagihan RS dari 100 pasien. Kebanyakan berutang Rp5–20 juta. Tapi beberapa rawat ICU menghabiskan Rp1,5 miliar+. Tagihan ekstrem itu membuat ekor panjang ke kanan. Mean tertarik ke ekor itu, tapi median tetap di tempat kebanyakan pasien berada.\n\nMiring kanan (Mean > Median): Biaya kesehatan, lama rawat, pendapatan.\nMiring kiri (Mean < Median): Usia kematian di negara maju — kebanyakan hidup tua, sebagian meninggal muda.\nSimetris (Mean ≈ Median): Tekanan darah, tinggi badan, kebanyakan nilai lab pada populasi sehat.\n\nAturan klinisnya: jika seseorang menyebut mean untuk data miring, curigai. Tanyakan mediannya." },
          { heading: "Rangkuman untuk Ujian", body: "• Menambahkan 10 ke setiap nilai? Mean bergeser 10, SD tetap sama. (Semua dapat bonus — sebarannya tidak berubah.)\n• Mengalikan dengan 2? Mean DAN SD dua-duanya berlipat ganda.\n• Mean selalu tertarik ke arah ekor.\n• Pencilan mempengaruhi: mean, range, SD. TIDAK mempengaruhi: median, modus, IQR.\n• Default untuk data klinis miring: Median + IQR." }
        ]
      },
      distributions: {
        sections: [
          { heading: "Hasil Lab yang Membuat Mahasiswa Kedokteran Panik", body: "Bulan kedua rotasi. Kamu mendapat hasil lab pada pasien sehat berusia 22 tahun. Hemoglobinnya 17,8 g/dL — ditandai merah sebagai \"TINGGI.\" Detak jantungmu melonjak. Apakah kamu harus menelepon dokter senior?\n\nResiden tersenyum. \"Tenang. Rentang referensi itu hanya ±2 standar deviasi dari mean populasi. Secara definisi, 5% orang yang sehat sempurna akan berada di luar rentang itu — 2,5% di setiap sisi. Pasienmu kemungkinan baik-baik saja.\"\n\nMomen itu mengkristalkan kebenaran penting: untuk praktik kedokteran, kamu harus memahami bagaimana \"normal\" didefinisikan." },
          { heading: "Kurva Lonceng — Tempat Sebagian Besar Kedokteran Berada", body: "Tekanan darah, berat lahir, kolesterol, skor tes kognitif — semuanya membentuk kurva berbentuk lonceng jika kamu mengukur cukup banyak orang. Ini bukan kebetulan. Ketika ratusan faktor genetik dan lingkungan kecil menjumlah, hasilnya mengarah ke bentuk lonceng. Itu kebenaran matematika mendalam yang disebut Teorema Limit Pusat.\n\nKurva ini didefinisikan oleh hanya dua angka:\n\nμ (mu) = pusat lonceng (mean populasi)\nσ (sigma) = seberapa lebar atau sempit lonceng (standar deviasi)\n\nUbah μ dan lonceng bergeser kiri-kanan. Ubah σ dan dia melebar (lebih datar) atau menyempit (lebih tinggi). Dua tombol mengendalikan seluruh bentuk." },
          { heading: "Aturan yang Akan Kamu Gunakan Setiap Hari: 68-95-99,7", body: "Ini aturan paling berguna dalam biostatistik:\n\n68% nilai berada dalam ±1σ dari mean.\n95% nilai berada dalam ±2σ.\n99,7% nilai berada dalam ±3σ.\n\nKembali ke pasien mahasiswa kita: jika hemoglobin punya μ = 15,5 dan σ = 1,0 pada pria muda, maka 17,8 sekitar 2,3σ di atas mean — di luar rentang 95% tapi tidak dramatis. Di klinik yang melihat ratusan pasien, kamu akan menemukan beberapa seperti ini.\n\nTapi jika nilai pasien 3σ jauhnya? Itu di luar 99,7% populasi. Sekarang perhatikan." },
          { heading: "Z-Score: Penerjemah Universal", body: "Lab berbeda punya satuan berbeda — hemoglobin dalam g/dL, trombosit dalam ribu/μL, kreatinin dalam mg/dL. Bagaimana membandingkan seberapa \"abnormal\" masing-masing?\n\nz = (nilai pasien − mean populasi) / SD\n\nZ-score +2 = \"2 SD di atas rata-rata.\" Z-score −3 = \"3 SD di bawah.\" Sekarang kamu bisa bilang: \"Hemoglobinnya sedikit tinggi (z = +1,5), tapi kreatininnya mengkhawatirkan (z = +3,8).\"\n\nKamu akan melihat z-score di ujian, grafik pertumbuhan pediatri, dan di jurnal manapun yang melakukan standarisasi data." },
          { heading: "Mengapa Statistik Benar-Benar Bekerja: Teorema Limit Pusat", body: "Eksperimen pikiran: ukur rata-rata tinggi badan 30 mahasiswa kedokteran acak. Lakukan lagi dengan kelompok berbeda. Dan lagi, ribuan kali. Plot semua rata-rata itu.\n\nTidak peduli seberapa aneh distribusi tinggi individu, distribusi rata-rata tersebut akan terlihat seperti kurva lonceng sempurna. Itulah TLP — dan itu sebabnya hampir setiap uji statistik bekerja. Data mentahmu tidak perlu normal. Kamu hanya perlu n ≥ 30.\n\nStandar Error (SE = σ/√n) mengukur seberapa presisi estimasimu. Studi lebih besar → SE lebih kecil → estimasi lebih tepat." },
          { heading: "Rangkuman untuk Ujian", body: "• Aturan 68-95-99,7 adalah dasar rentang referensi lab. Hafalkan.\n• Z-score = (nilai − mean) / SD. Melampaui ±2 berarti \"tidak biasa\" (di luar 95%).\n• ~5% pasien sehat akan punya lab \"abnormal\" — secara desain, bukan penyakit.\n• TLP mengatakan rata-rata sampel terdistribusi normal meski data individu tidak.\n• SE = σ/√n: studi lebih besar → presisi lebih tinggi." }
        ]
      },
      probability: {
        sections: [
          { heading: "Tes yang Benar 99% (tapi Tetap Salah)", body: "Bulan ketiga. Kamu di klinik kesehatan mahasiswa. Seorang mahasiswa 20 tahun — tanpa faktor risiko, tanpa gejala — menjalani tes HIV rutin. Sensitivitas 99,9%, spesifisitas 99,9%. Hasilnya positif.\n\nMahasiswa itu ketakutan. Kamu hampir berkata \"Maaf\" ketika dokter seniormu menghentikanmu.\n\nDi populasi berisiko rendah ini, prevalensi HIV sekitar 0,01%. Dari 100.000 mahasiswa:\n• 10 punya HIV → ~10 tes positif (positif benar)\n• 99.990 tidak punya → ~100 tes positif (positif palsu)\n\n110 hasil positif, hanya 10 yang benar. Probabilitas mahasiswa ini benar-benar punya HIV? Sekitar 9%.\n\nTesnya akurat 99,9%. Matematikanya tetap mengatakan pasien kemungkinan tidak punya HIV. Selamat datang di teorema Bayes." },
          { heading: "Mengapa Intuisimu Sudah Bayesian", body: "Kamu sudah melakukan ini setiap hari. Ketika atlet 25 tahun datang dengan nyeri dada, otakmu memberikan probabilitas pre-test yang rendah untuk serangan jantung. Ketika perokok 68 tahun dengan diabetes datang dengan gejala yang sama, probabilitasmu melonjak.\n\nTroponin positif memiliki arti yang sangat berbeda pada dua pasien ini — karena mereka memulai dari baseline yang berbeda.\n\nTeorema Bayes memformalisasi ini: Probabilitas post-test = f(probabilitas pre-test, karakteristik tes). Hasil sama, arti berbeda, tergantung siapa yang kamu tes." },
          { heading: "Tabel 2×2: Kalkulator Diagnostikmu", body: "Ini alat praktisnya. Bayangkan menguji 10.000 orang. Prevalensi: 5%, sensitivitas: 90%, spesifisitas: 95%.\n\n1. 500 punya penyakit, 9.500 tidak\n2. Dari 500 yang sakit: 90% tes positif → 450 PB, 50 NP\n3. Dari 9.500 yang sehat: 95% tes negatif → 9.025 NB, 475 PP\n\nNPP = 450 / (450 + 475) = 48,6%. Tes positif hanya memberimu peluang seperti lempar koin! Orang sehat jauh melebihi orang sakit, jadi bahkan tingkat positif palsu yang kecil menghasilkan ratusan alarm palsu." },
          { heading: "Rasio Kemungkinan: Jalan Pintas yang Disukai Dokter Senior", body: "Mengisi tabel 2×2 saat ronde terlalu lama. Rasio kemungkinan (likelihood ratio) bisa dihitung di kepala:\n\nLR+ = Sensitivitas / (1 − Spesifisitas) → seberapa besar hasil positif meningkatkan peluang penyakit\nLR− = (1 − Sensitivitas) / Spesifisitas → seberapa besar hasil negatif menurunkan peluang\n\nResepnya: konversi probabilitas pre-test ke odds → kalikan dengan LR → konversi balik.\n\nLR+ di atas 10? Bukti kuat menegakkan diagnosis. LR− di bawah 0,1? Bukti kuat menyingkirkan diagnosis. LR mendekati 1? Kamu membuang darah pasien dan uang rumah sakit." },
          { heading: "Pelajarannya: Kapan TIDAK Memesan Tes", body: "Jika prevalensi sangat rendah, bahkan tes yang sangat baik menghasilkan lebih banyak positif palsu daripada positif benar. Inilah mengapa kita tidak menyaring setiap mahasiswa 20 tahun untuk kanker pankreas.\n\nSebelum memesan tes apapun, tanyakan: \"Berapa probabilitas pre-test saya?\" Jika sangat rendah dan tesnya tidak sangat spesifik, hasil positif akan menyebabkan lebih banyak kecemasan daripada kejelasan.\n\nKlinisi terbaik tidak hanya tahu tes mana yang harus dipesan — mereka tahu tes mana yang TIDAK harus dipesan." },
          { heading: "Rangkuman untuk Ujian", body: "• NPP bergantung pada prevalensi. Prevalensi rendah → NPP rendah, meskipun tes bagus.\n• Sensitivitas & spesifisitas = sifat TES (tidak berubah dengan prevalensi).\n• NPP & NPN = sifat tes + populasi.\n• LR+ > 10 = tes positif kuat. LR− < 0,1 = tes negatif kuat.\n• Selalu mulai dari probabilitas pre-test — itu jangkar untuk semuanya." }
        ]
      },
      hypothesis: {
        sections: [
          { heading: "Obat yang \"Berhasil\" (tapi Tidak Berarti)", body: "Elektif penelitian. PI masuk rapat lab sambil tersenyum: \"Kita dapat p = 0,001! Paper ini akan jadi besar.\"\n\nKamu melihat datanya. Obat tekanan darah baru menurunkan sistolik... 0,4 mmHg vs. plasebo. Pada 48.000 pasien. Efeknya nyata — p-value mengonfirmasi itu — tapi 0,4 mmHg tidak membuat perbedaan apapun. Pasienmu tidak akan merasa lebih baik, hidup lebih lama, atau terhindar dari stroke.\n\nIni pelajaran terpenting dalam uji hipotesis: signifikansi statistik bukan signifikansi klinis. P-value memberitahu bahwa efek itu ada. Ia tidak mengatakan apapun tentang apakah efek itu penting." },
          { heading: "Apa Arti P-Value Sebenarnya (Semua Orang Salah Memahami Ini)", body: "Kamu menguji apakah obat baru menurunkan kolesterol. H₀: \"tidak ada perbedaan.\" Kamu mendapat p = 0,03.\n\nArtinya: \"Jika obat benar-benar tidak melakukan apa-apa, ada peluang 3% melihat hasil seekstrem ini.\"\n\nJebakan-jebakannya:\n\"3% kemungkinan obat tidak bekerja.\" SALAH. P-value ≠ probabilitas H₀ benar.\n\"Obat bekerja dengan 97% kepastian.\" SALAH. Kamu tidak bisa menghitung 1 − p.\n\"Efeknya besar karena p kecil.\" SALAH. Dengan n besar, efek kecil tak bermakna bisa punya p-value kecil.\n\nAnggap p-value seperti detektor logam berbunyi. Ia mengatakan \"ada sesuatu di sini\" — bukan apakah itu koin emas atau tutup botol." },
          { heading: "Dua Cara untuk Salah (Analogi UGD)", body: "Kamu di UGD. Dua jenis kesalahan yang merusak malammu:\n\nKesalahan Tipe I (Alarm Palsu): Kamu mendiagnosis usus buntu, bergegas ke operasi — usus buntunya normal. Kamu \"menolak\" null padahal benar. Konsekuensi: operasi yang tidak perlu.\n\nKesalahan Tipe II (Diagnosis Terlewat): Kamu memulangkan pasien dengan \"flu perut\" — mereka kembali keesokan harinya dengan usus buntu pecah. Kamu \"gagal menolak\" null padahal usus buntu memang ada.\n\nDalam penelitian: α (biasanya 0,05) = tingkat alarm palsu yang bisa diterima. β = probabilitas melewatkan efek nyata. Power = 1 − β = peluang menangkap efek nyata." },
          { heading: "Power: Mengapa Studi Kecil Berbahaya", body: "Seorang dokter senior menyebut studi: 15 pasien per kelompok, \"tidak ada perbedaan signifikan\" antara dua obat. \"Jadi keduanya setara,\" katanya.\n\nTunggu dulu. Dengan 15 pasien, studi itu mungkin hanya punya power 30% — peluang 70% melewatkan perbedaan nyata. Studi itu tidak dirancang untuk menemukan apapun.\n\nPower meningkat dengan: ukuran sampel lebih besar (paling praktis), efek lebih besar, α lebih tinggi (tradeoff), variansi lebih rendah. Jika kamu tidak bisa mencapai 80% power, studi itu tidak layak dijalankan." },
          { heading: "Confidence Interval: Yang Disembunyikan P-Value", body: "Paper A: \"Obat menurunkan LDL 15 mg/dL (95% CI: 8–22, p < 0,001).\" CI menunjukkan efek sebenarnya antara 8 dan 22 — semua bermakna secara klinis. Temuan berguna.\n\nPaper B: \"Obat menurunkan LDL 2 mg/dL (95% CI: 0,5–3,5, p = 0,01).\" Tetap signifikan! Tapi CI menunjukkan efek sebenarnya antara 0,5 dan 3,5 — tidak ada yang bermakna secara klinis. CI mengungkap apa yang disembunyikan p-value.\n\nJika 95% CI melewati nol (misalnya, −3 sampai +8), kamu bahkan tidak bisa yakin obatnya melakukan apapun." },
          { heading: "Jebakan Perbandingan Ganda", body: "Perusahaan farmasi menguji obatnya terhadap 20 outcome. Pada α = 0,05, kamu akan mengharapkan 1 dari 20 \"signifikan\" murni karena kebetulan.\n\nBenar saja, siaran pers: \"Obat secara signifikan memperbaiki kualitas tidur (p = 0,03)!\" Mereka tidak menyebut 19 hasil null lainnya.\n\nKoreksi Bonferroni: bagi α dengan jumlah tes (0,05/20 = 0,0025). Perlindungan sebenarnya adalah skeptisisme ketika kamu melihat satu temuan cherry-picked dari banyak analisis." },
          { heading: "Rangkuman untuk Ujian", body: "• P-value = probabilitas data jika H₀ benar. BUKAN probabilitas H₀ benar.\n• Tipe I = positif palsu (α). Tipe II = negatif palsu (β). Power = 1 − β.\n• ↑ n → ↑ power. Target ≥ 80%.\n• Selalu lihat ukuran efek + CI — bukan hanya p-value.\n• Signifikansi statistik ≠ signifikansi klinis.\n• 20 tes pada α=0,05 → ekspektasi 1 positif palsu." }
        ]
      },
      diagnostic: {
        sections: [
          { heading: "Tes Rapid Strep yang Mengubah Diagnosis", body: "Klinik Jumat sore. Anak 7 tahun: sakit tenggorokan, demam, tonsil bengkak. Gambaran strep klasik. Tes rapid strep — negatif.\n\nApakah kamu mempercayainya?\n\nDokter seniormu: \"Berapa sensitivitasnya?\" Kamu mencari: sekitar 85%. Artinya dari 100 anak yang benar-benar punya strep, tes ini melewatkan 15. Dengan presentasi seklasik ini — probabilitas pre-test mungkin 60-70% — hasil negatif dari tes dengan sensitivitas 85% seharusnya tidak membuatmu yakin.\n\nDia memesan kultur tenggorokan dan memulai antibiotik empiris. Tiga hari kemudian, kultur kembali positif.\n\nInilah mengapa kamu perlu memahami karakteristik tes — bukan hanya \"positif\" atau \"negatif,\" tapi apa arti hasil itu untuk PASIEN INI." },
          { heading: "Sensitivitas: Penjaga yang Memasukkan Semua Orang", body: "Bayangkan penjaga pintu yang tugasnya menangkap setiap VIP (pasien sakit). Sensitivitas tinggi = menangkap hampir semua VIP, tapi tidak sengaja memasukkan beberapa orang biasa juga (positif palsu). Dia lebih memilih memasukkan berlebihan daripada melewatkan orang penting.\n\nSensitivitas = PB / (PB + NP) — dari semua yang sakit, berapa banyak yang tertangkap tes?\n\nSensitivitas 95% = 5% pasien sakit terlewat (tingkat negatif palsu).\n\nKetika sensitivitas tinggi dan tes NEGATIF → kamu bisa menyingkirkan penyakit.\nTrik memori: SNout — Sensitif, Negatif, singkirkan (rules OUT).\n\nPenggunaan: tes skrining. Melewatkan kanker lebih buruk dari alarm palsu." },
          { heading: "Spesifisitas: Penjaga yang Menghalangi Penipu", body: "Penjaga berbeda. Prioritasnya: mencegah non-VIP masuk. Dia tidak pernah membiarkan orang biasa lewat — tapi kadang tanpa sengaja memblokir VIP asli (negatif palsu).\n\nSpesifisitas = NB / (NB + PP) — dari semua yang sehat, berapa yang teridentifikasi dengan benar?\n\nSpesifisitas 95% = 5% orang sehat mendapat hasil positif palsu.\n\nKetika spesifisitas tinggi dan tes POSITIF → kamu bisa menegakkan diagnosis.\nTrik memori: SpIn — Spesifik, Positif, tegakkan (rules IN).\n\nPenggunaan: tes konfirmasi. Kamu akan memulai kemo — kamu perlu yakin." },
          { heading: "Jebakan Prevalensi", body: "Tes rapid strep punya sensitivitas dan spesifisitas yang sama di mana-mana — angka itu melekat pada tesnya. Tapi NPP dan NPN berubah tergantung DI MANA kamu menggunakannya.\n\nKlinik pediatri kaya strep (prevalensi 30%): rapid strep positif kemungkinan benar.\nSkrining wellness pada mahasiswa sehat (prevalensi 1%): kebanyakan positif adalah alarm palsu.\n\nTes sama. Akurasi sama. Arti yang sama sekali berbeda. Inilah mengapa dokter UGD berpikir berbeda tentang troponin positif pada pria 65 tahun yang mencengkram dadanya vs. pelari maraton 22 tahun." },
          { heading: "Rasio Kemungkinan: Berpikir Seperti Dokter Senior", body: "LR menangkap seberapa besar tes mengubah pikiranmu:\n\nLR+ = Sensitivitas / (1 − Spesifisitas) → \"Seberapa lebih mungkin positif ini pada orang sakit vs. sehat?\"\nLR− = (1 − Sensitivitas) / Spesifisitas → \"Seberapa kurang mungkin negatif ini pada orang sakit vs. sehat?\"\n\nLR+ > 10 → bukti kuat UNTUK penyakit\nLR+ 5-10 → pergeseran sedang\nLR = 1 → tes tidak berguna\nLR− < 0,1 → bukti kuat MELAWAN penyakit\n\nKeindahannya: LR tidak berubah dengan prevalensi, jadi bisa dipakai di setting klinis manapun." },
          { heading: "Rangkuman untuk Ujian", body: "• Sensitivitas & spesifisitas = intrinsik pada tes. Tidak berubah dengan prevalensi.\n• NPP & NPN = bergantung pada populasi. Berubah drastis dengan prevalensi.\n• SNout: Sensitif + Negatif → Singkirkan. SpIn: Spesifik + Positif → Tegakkan.\n• Tes sensitif untuk skrining, tes spesifik untuk konfirmasi.\n• LR+ > 10 = kuat menegakkan. LR− < 0,1 = kuat menyingkirkan.\n• ROC AUC: 0,5 = tidak berguna, 1,0 = sempurna." }
        ]
      },
      study: {
        sections: [
          { heading: "Kontroversi Kopi yang Menipu Satu Generasi", body: "Di tahun 1980-an, studi menghubungkan kopi dengan penyakit jantung. Berita utama berteriak. Orang-orang beralih ke decaf. Kecuali... studi-studi itu salah.\n\nPeminum kopi juga lebih mungkin merokok, kurang olahraga, dan makan tidak sehat. Studi mengukur asosiasi antara kopi dan penyakit jantung, tapi penyebab sebenarnya adalah gaya hidup yang berkorelasi dengan minum kopi.\n\nBegitu peneliti mengontrol merokok, asosiasinya menghilang. Studi selanjutnya dengan desain lebih baik bahkan menunjukkan kopi mungkin protektif.\n\nIni prinsip terpenting dalam penelitian klinis: asosiasi bukan kausalitas. Desain studi menentukan seberapa kamu bisa mempercayai kesimpulannya." },
          { heading: "Tangga Bukti", body: "Bayangkan desain studi sebagai tangga kepercayaan:\n\nPuncak — RCT: Kamu secara acak menempatkan pasien ke pengobatan atau plasebo. Randomisasi menyeimbangkan segalanya — perancu yang diketahui dan tidak diketahui. SATU-SATUNYA cara mengatakan \"obat ini MENYEBABKAN outcome itu.\" Ukuran: Risiko Relatif.\n\nTengah — Kohort: Identifikasi yang terpapar (perokok) dan tidak terpapar (bukan perokok), ikuti ke depan. Kamu mendapat insidensi dan RR, tapi perancu mengintai di mana-mana.\n\nBawah — Kasus-Kontrol: Mulai dari orang yang sudah punya penyakit (kasus) vs. yang tidak (kontrol), lihat ke belakang pada paparan. Cepat, murah, penting untuk penyakit langka. Tapi hanya menghasilkan odds ratio, dan recall bias selalu mengancam.\n\nDasar — Potong Lintang: Potret dalam satu waktu. Mengukur prevalensi. Tidak bisa menentukan mana duluan, jadi kausalitas tidak mungkin." },
          { heading: "NNT: Angka yang Benar-Benar Membantu Pasienmu", body: "Medical rep berkata: \"Statin kami mengurangi serangan jantung 36%!\" Kedengarannya luar biasa.\n\nLihat lebih dekat. Kelompok kontrol: tingkat serangan jantung 3% selama 5 tahun. Pengobatan: 1,9%. Penurunan risiko relatif: 36%. Tapi penurunan risiko absolut: hanya 1,1%. Kamu harus mengobati sekitar 91 pasien selama 5 tahun agar SATU terhindar dari serangan jantung. 90 lainnya minum pil setiap hari tanpa manfaat.\n\nNNT = 1/ARR. Ini ukuran efikasi paling jujur. Bandingkan dengan NNH (Number Needed to Harm). Jika NNT = 91 dan NNH = 200: tradeoff wajar. Jika NNT = 91 dan NNH = 10: pertimbangkan ulang." },
          { heading: "Paradoks Skrining: Ketika Deteksi Dini Berbohong", body: "Pusat kanker mengumumkan: \"Ketahanan hidup 5 tahun meningkat dari 40% menjadi 65% sejak kita mulai skrining!\" Dewan merayakan. Lalu seorang epidemiolog yang tajam bertanya: \"Apakah lebih sedikit orang yang benar-benar meninggal?\"\n\nHening. Karena mungkin tidak. Dua bias licik:\n\nLead-time bias: Deteksi kanker 3 tahun lebih awal → pasien \"bertahan\" 3 tahun lebih lama dari diagnosis. Tapi mereka meninggal di usia yang sama persis. Kamu tidak memperpanjang hidup — kamu memperpanjang waktu mereka tahu mereka sakit.\n\nLength-time bias: Skrining menangkap tumor tumbuh lambat (jendela deteksi lebih lama). Tumor agresif membunuh cepat dan lolos dari skrining. Populasi yang diskrining terlihat lebih sehat — tapi kamu menangkap kanker yang kurang berbahaya.\n\nUkuran jujurnya: apakah angka kematian keseluruhan benar-benar turun?" },
          { heading: "Bias: Penyabotase Tak Terlihat", body: "Setiap studi punya musuh:\n\nRecall bias: Ibu dari bayi dengan cacat lahir mengingat setiap obat yang diminum selama kehamilan. Ibu dari bayi sehat lupa. Sekarang studi kasus-kontrolmu secara palsu menghubungkan obat yang tidak berbahaya dengan cacat.\n\nSelection bias: Kamu mempelajari penyakit jantung di RS besar — tapi pasien di sana lebih sakit dan lebih kaya dari populasi umum. Hasilmu tidak bisa digeneralisasi.\n\nConfounding: Kopi dan penyakit jantung. Merokok terasosiasi dengan KEDUANYA — minum kopi dan penyakit jantung — perancu yang bersembunyi dalam data. Penangkal: randomisasi atau penyesuaian statistik.\n\nEfek Hawthorne: Orang mengubah perilaku karena tahu sedang diteliti. Kedua kelompok membaik — bukan karena obat, tapi karena mereka mulai makan lebih sehat saat bergabung dalam uji coba." },
          { heading: "Rangkuman untuk Ujian", body: "• RCT = kausalitas. Lainnya = asosiasi.\n• Kohort → RR. Kasus-Kontrol → OR. Potong Lintang → Prevalensi.\n• NNT = 1/ARR. Bandingkan dengan NNH untuk keputusan manfaat-risiko.\n• OR ≈ RR ketika penyakit jarang.\n• Lead-time bias: deteksi dini ≠ hidup lebih lama. Ukur mortalitas.\n• Perancu = terasosiasi dengan paparan DAN outcome.\n• ITT menganalisis semua sesuai penempatan — mempertahankan randomisasi." }
        ]
      }
    };

      const [sens, setSens] = React.useState(95), [spec, setSpec] = React.useState(90), [prev, setPrev] = React.useState(10);
      const pop = 1000, d = Math.round(pop * prev / 100), h = pop - d;
      const tp = Math.round(d * sens / 100), fn = d - tp, fp = Math.round(h * (1 - spec / 100)), tn = h - fp;
      const ppv = tp / (tp + fp) || 0, npv = tn / (tn + fn) || 0, lrp = (sens / 100) / (1 - spec / 100), lrn = (1 - sens / 100) / (spec / 100);
      return (<div><Vignette>Atur karakteristik tes dan prevalensi untuk melihat tabel 2×2 lengkap diperbarui.</Vignette><div style={{ marginBottom: 16 }}><label style={S.sliderLabel}>Sensitivitas: {sens}%</label><input type="range" min={50} max={100} value={sens} onChange={e => setSens(+e.target.value)} style={S.slider} /><label style={S.sliderLabel}>Spesifisitas: {spec}%</label><input type="range" min={50} max={100} value={spec} onChange={e => setSpec(+e.target.value)} style={S.slider} /><label style={S.sliderLabel}>Prevalensi: {prev}%</label><input type="range" min={1} max={80} value={prev} onChange={e => setPrev(+e.target.value)} style={S.slider} /></div><table style={S.table}><thead><tr><th style={S.th}></th><th style={S.th}>D+</th><th style={S.th}>D−</th><th style={S.th}>Total</th></tr></thead><tbody><tr><td style={S.td}>T+</td><td style={{ ...S.td, background: "#1B3A2A", color: "var(--green)" }}>{tp}</td><td style={{ ...S.td, background: "#3A1B1B", color: "var(--red)" }}>{fp}</td><td style={S.td}>{tp + fp}</td></tr><tr><td style={S.td}>T−</td><td style={{ ...S.td, background: "#3A1B1B", color: "var(--red)" }}>{fn}</td><td style={{ ...S.td, background: "#1B3A2A", color: "var(--green)" }}>{tn}</td><td style={S.td}>{fn + tn}</td></tr><tr><td style={{ ...S.td, fontWeight: 700 }}>Total</td><td style={S.td}>{d}</td><td style={S.td}>{h}</td><td style={S.td}>{pop}</td></tr></tbody></table><div style={S.statRow}><StatCard label="PPV" value={`${(ppv * 100).toFixed(1)}%`} color="var(--accent)" /><StatCard label="NPV" value={`${(npv * 100).toFixed(1)}%`} color="var(--green)" /><StatCard label="LR+" value={lrp.toFixed(1)} color="var(--yellow)" /><StatCard label="LR−" value={lrn.toFixed(3)} color="var(--red)" /></div><div style={{ marginTop: 12, padding: 12, background: "var(--bg-card)", borderRadius: 8, fontSize: 12, fontFamily: "var(--font-mono)", color: "var(--text-secondary)" }}><strong>Mnemonik:</strong><br />SpIn = Spesifik + Positif → tegakkan diagnosis<br />SNout = Sensitif + Negatif → singkirkan diagnosis</div></div>);
    }
    function StudyModule() {
      const [sel, setSel] = React.useState(null);
      const designs = [{ name: "RCT", level: 1, desc: "Standar emas untuk kausalitas.", strengths: "Menegakkan kausalitas", weaknesses: "Mahal, kendala etis", measure: "Risiko Relatif" }, { name: "Cohort", level: 2, desc: "Ikuti yang terpapar vs tidak terpapar ke depan.", strengths: "Menghitung insidensi & RR", weaknesses: "Perancu, loss to follow-up", measure: "Risiko Relatif" }, { name: "Case-Control", level: 3, desc: "Kasus vs kontrol, lihat ke belakang.", strengths: "Efisien untuk penyakit langka", weaknesses: "Recall bias, tidak bisa hitung insidensi", measure: "Odds Ratio" }, { name: "Cross-Sectional", level: 4, desc: "Potret dalam satu waktu.", strengths: "Cepat, mengukur prevalensi", weaknesses: "Tidak ada temporalitas → tidak ada kausalitas", measure: "Prevalence, OR" }, { name: "Case Series", level: 5, desc: "Laporan deskriptif kasus serupa.", strengths: "Menghasilkan hipotesis", weaknesses: "Tidak ada kelompok kontrol", measure: "Tidak ada" }];
      const biases = [{ name: "Selection Bias", ex: "Studi RS terlalu mewakili kasus berat." }, { name: "Recall Bias", ex: "Kasus mengingat paparan lebih dari kontrol." }, { name: "Lead-Time Bias", ex: "Deteksi lebih awal tampak memperpanjang ketahanan hidup." }, { name: "Length-Time Bias", ex: "Skrining menangkap tumor yang tumbuh lambat." }, { name: "Confounding", ex: "Kopi → kanker? Tidak — perokok minum lebih banyak kopi." }];
      return (<div><Vignette>Ketuk setiap desain studi untuk menjelajahi karakteristiknya.</Vignette><div style={{ fontSize: 11, color: "var(--text-muted)", marginBottom: 8, fontFamily: "var(--font-mono)" }}>HIERARKI BUKTI</div>{designs.map((d, i) => <div key={d.name} onClick={() => setSel(sel === i ? null : i)} style={{ padding: "10px 14px", marginBottom: 4, background: sel === i ? "var(--bg-accent)" : "var(--bg-card)", border: `1px solid ${sel === i ? "var(--accent)" : "var(--border)"}`, borderRadius: 8, cursor: "pointer", transition: "all 0.2s" }}><div style={{ display: "flex", justifyContent: "space-between" }}><span style={{ fontWeight: 600, color: "var(--text-primary)", fontSize: 14 }}><span style={{ color: "var(--accent)", marginRight: 8, fontFamily: "var(--font-mono)", fontSize: 12 }}>L{d.level}</span>{d.name}</span><span style={{ color: "var(--accent)" }}>{sel === i ? "−" : "+"}</span></div>{sel === i && <div style={{ marginTop: 10, fontSize: 13, color: "var(--text-secondary)", lineHeight: 1.6 }}><p style={{ margin: "0 0 6px" }}>{d.desc}</p><p style={{ margin: "0 0 4px" }}><span style={{ color: "var(--green)" }}>✓</span> {d.strengths}</p><p style={{ margin: "0 0 4px" }}><span style={{ color: "var(--red)" }}>✗</span> {d.weaknesses}</p><p style={{ margin: 0 }}><span style={{ color: "var(--yellow)" }}>📏</span> {d.measure}</p></div>}</div>)}<div style={{ fontSize: 11, color: "var(--text-muted)", marginBottom: 8, marginTop: 16, fontFamily: "var(--font-mono)" }}>BIAS UMUM</div>{biases.map(b => <div key={b.name} style={{ padding: "8px 12px", marginBottom: 4, background: "var(--bg-card)", borderRadius: 6, borderLeft: "3px solid var(--red)" }}><div style={{ fontWeight: 600, color: "var(--text-primary)", fontSize: 13 }}>{b.name}</div><div style={{ fontSize: 12, color: "var(--text-muted)", marginTop: 2 }}>{b.ex}</div></div>)}</div>);
    }

    // ========== FINAL EXAM RESULTS ==========
    function FinalExamHasils({ answers, questions, identityData, finalAttempts, onRetry, onViewLeaderboard, quizAttempts }) {
      const score = answers.filter((a, i) => a === questions[i].correct).length, total = questions.length, pct = Math.round((score / total) * 100), numi = Math.round((score / total) * 1000);
      const domains = {}; questions.forEach((q, i) => { if (!domains[q.domain]) domains[q.domain] = { correct: 0, total: 0 }; domains[q.domain].total++; if (answers[i] === q.correct) domains[q.domain].correct++; });

        <div style={{ display: "inline-block", padding: "4px 16px", borderRadius: 20, background: tier.color + "22", color: tier.color, fontWeight: 700, fontSize: 14, margin: "16px 0 8px", fontFamily: "var(--font-mono)" }}>{tier.label}</div>
        <div style={{ fontSize: 13, color: "var(--text-secondary)", maxWidth: 340, margin: "0 auto 24px", lineHeight: 1.5 }}>{tier.desc}</div>
        <div style={{ display: "flex", gap: 8, marginBottom: 20 }}><StatCard label="Benar" value={`${score}/${total}`} color="var(--green)" /><StatCard label="Akurasi" value={`${pct}%`} color="var(--accent)" /><StatCard label="NUMi" value={numi} color={tier.color} /></div>
        <div style={{ textAlign: "left", marginBottom: 20 }}><div style={{ fontSize: 11, textTransform: "uppercase", letterSpacing: 1.5, color: "var(--text-muted)", fontFamily: "var(--font-mono)", marginBottom: 10 }}>RINCIAN PER DOMAIN</div>{Object.entries(domains).map(([domain, data]) => { const dpct = Math.round((data.correct / data.total) * 100); const mod = MODULES.find(m => m.id === domain); return (<div key={domain} style={{ marginBottom: 10 }}><div style={{ display: "flex", justifyContent: "space-between", fontSize: 12, marginBottom: 4, color: "var(--text-primary)" }}><span>{mod?.icon} {mod?.title || domain}</span><span style={{ fontFamily: "var(--font-mono)", color: dpct >= 80 ? "var(--green)" : dpct >= 60 ? "var(--yellow)" : "var(--red)" }}>{data.correct}/{data.total} ({dpct}%)</span></div><div style={{ height: 6, background: "var(--border)", borderRadius: 3, overflow: "hidden" }}><div style={{ height: "100%", width: `${dpct}%`, background: dpct >= 80 ? "var(--green)" : dpct >= 60 ? "var(--yellow)" : "var(--red)", borderRadius: 3, transition: "width 0.5s ease" }} /></div></div>); })}</div>
        <div style={{ padding: 14, background: "var(--bg-card)", borderRadius: 10, textAlign: "left", fontSize: 12, color: "var(--text-secondary)", lineHeight: 1.6, borderLeft: `3px solid ${tier.color}`, marginBottom: 24 }}><strong style={{ color: "var(--text-primary)" }}>Interpretasi NUMi</strong><br />900–1000: Ahli<br />750–899: Mahir<br />600–749: Berkembang<br />Di bawah 600: Dasar</div>
        <div style={{ display: "flex", flexDirection: "column", gap: 12, marginTop: 24 }}>
          <button onClick={onRetry} style={{ padding: "14px", borderRadius: 10, border: "1px solid var(--accent)", background: "transparent", color: "var(--accent)", cursor: "pointer", fontFamily: "var(--font-mono)", fontSize: 13, fontWeight: 600, transition: "all 0.2s" }}>↻ Ulangi Ujian Akhir</button>
          <button onClick={onViewLeaderboard} style={{ padding: "14px", borderRadius: 10, border: "none", background: "var(--accent)", color: "#fff", cursor: "pointer", fontFamily: "var(--font-mono)", fontSize: 13, fontWeight: 600, transition: "all 0.2s" }}>🏆 Lihat Papan Skor</button>
        </div>
      </div>);
    }

    // ========== STORAGE & LEADERBOARD ==========
    const DB_KEY = 'biostatistik_lab_scores';
    function saveResult(numiScore, domainScoresArray, identityData, quizAttemptsData) {
      if (!identityData) return;
      const existing = getAllScores().filter(e => e.npm !== identityData.npm);
      const entry = {
        id: Date.now(),
        name: identityData.name,
        npm: identityData.npm,
        angkatan: identityData.batch,
        numiScore,
        domainScores: domainScoresArray,
        quizAttempts: quizAttemptsData || {},
        timestamp: new Date().toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' })
      };

      existing.push(entry);
      localStorage.setItem(DB_KEY, JSON.stringify(existing));

      fetch('/api/save-score', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(entry)
      }).catch(err => console.error("Failed to sync score to global DB", err));
    }
    function getAllScores() {
      try { return JSON.parse(localStorage.getItem(DB_KEY)) || []; } catch { return []; }
    }
    function clearAllScores(callback) {
      if (confirm('Hapus semua data skor? Tindakan ini tidak dapat dibatalkan.')) {
        localStorage.removeItem(DB_KEY);
        if (callback) callback();
      }
    }

    function Leaderboard() {
      const [data, setData] = React.useState(getAllScores().sort((a, b) => b.numiScore - a.numiScore));
      const [loading, setLoading] = React.useState(true);

      React.useEffect(() => {
        fetch('/api/get-scores')
          .then(res => res.json())
          .then(globalScores => {
            if (Array.isArray(globalScores)) {
              const localScores = getAllScores();
              const merged = [...localScores];
              const localIds = new Set(localScores.map(s => s.id));
              globalScores.forEach(s => {
                if (!localIds.has(s.id)) {
                  merged.push(s);
                }
              });
              
              const npmMap = new Map();
              merged.sort((a, b) => a.id - b.id).forEach(item => {
                npmMap.set(item.npm, item);
              });
              const finalData = Array.from(npmMap.values()).sort((a, b) => b.numiScore - a.numiScore);
              
              setData(finalData);
              localStorage.setItem(DB_KEY, JSON.stringify(finalData));
            }
            setLoading(false);
          })
          .catch(err => {
            console.error("Failed to fetch global scores", err);
            setLoading(false);
          });
      }, []);

      const exportData = () => {
        if (!data || data.length === 0) return;

        const separator = ";";
        let csv = "Peringkat;Nama;NPM;Angkatan;Skor NUMI";
        MODULES.forEach(m => csv += separator + m.title);
        csv += separator + "Waktu Selesai\n";

        data.forEach((entry, i) => {
          let row = [
            i + 1,
            `"${entry.name}"`,
            `"${entry.npm}"`,
            `"${entry.angkatan}"`,
            entry.numiScore
          ];
          entry.domainScores.forEach(s => row.push(s));
          row.push(`"${entry.timestamp}"`);
          csv += row.join(separator) + "\n";
        });

        // Add UTF-8 BOM so Excel automatically recognizes the encoding
        const bom = new Uint8Array([0xEF, 0xBB, 0xBF]);
        const blob = new Blob([bom, csv], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.setAttribute("href", url);
        link.setAttribute("download", "Data_Peserta_Biostatistik.csv");
        link.style.visibility = 'hidden';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      };

      if (data.length === 0) {
        return (
          <div style={{ animation: "fadeUp 0.35s ease" }}>
            <div style={{ fontFamily: "var(--font-mono)", fontSize: 10, letterSpacing: "0.12em", textTransform: "uppercase", color: "var(--accent)", marginBottom: 8 }}>Data Semua Peserta</div>
            <h2 style={{ fontFamily: "'Syne', sans-serif", fontSize: 28, fontWeight: 800, lineHeight: 1.15, marginBottom: 10, color: "var(--text-primary)" }}>
              Papan Skor {loading && <span style={{fontSize: 14, color: "var(--text-muted)", marginLeft: 8, fontWeight: 400, fontFamily: "var(--font-mono)"}}>Mengambil data global...</span>}
            </h2>
            <p style={{ fontSize: 15, color: "var(--text-secondary)", lineHeight: 1.65, maxWidth: 540, marginBottom: 32 }}>Daftar seluruh mahasiswa yang telah menyelesaikan ujian, diurutkan berdasarkan skor tertinggi.</p>
            <div style={{ background: "var(--bg-card)", border: "1px solid var(--border)", borderRadius: 16, overflow: "hidden" }}>
              <div className="empty-state">
                <div className="es-icon">📋</div>
                Belum ada data peserta yang menyelesaikan ujian.
              </div>
            </div>
          </div>
        );
      }

      return (
        <div style={{ animation: "fadeUp 0.35s ease" }}>
          <div style={{ fontFamily: "var(--font-mono)", fontSize: 10, letterSpacing: "0.12em", textTransform: "uppercase", color: "var(--accent)", marginBottom: 8 }}>Data Semua Peserta</div>
          <h2 style={{ fontFamily: "'Syne', sans-serif", fontSize: 28, fontWeight: 800, lineHeight: 1.15, marginBottom: 10, color: "var(--text-primary)" }}>
            Papan Skor {loading && <span style={{fontSize: 14, color: "var(--text-muted)", marginLeft: 8, fontWeight: 400, fontFamily: "var(--font-mono)"}}>Mengambil data global...</span>}
          </h2>
          <p style={{ fontSize: 15, color: "var(--text-secondary)", lineHeight: 1.65, maxWidth: 540, marginBottom: 32 }}>Daftar seluruh mahasiswa yang telah menyelesaikan ujian, diurutkan berdasarkan skor tertinggi.</p>

              <thead>
                <tr>
                  <th>#</th>
                  <th>Mahasiswa</th>
                  <th>Angkatan</th>
                  <th>NUMI</th>
                  {MODULES.map(m => <th key={m.id} style={{ fontSize: 9 }}>{m.title.split(' ')[0]}</th>)}
                  <th>Waktu</th>
                </tr>
              </thead>
              <tbody>
                {data.map((entry, i) => {
                  const rank = i + 1;
                  const rankClass = rank === 1 ? 'rank-1' : rank === 2 ? 'rank-2' : rank === 3 ? 'rank-3' : 'rank-n';
                  const scoreClass = entry.numiScore >= 750 ? 'score-high' : entry.numiScore >= 600 ? 'score-mid' : 'score-low';
                  return (
                    <tr key={entry.id}>
                      <td><span className={`rank-badge ${rankClass}`}>{rank}</span></td>
                      <td><strong>{entry.name}</strong><br /><span style={{ fontSize: 12, color: "var(--text-muted)", fontFamily: "var(--font-mono)" }}>{entry.npm}</span></td>
                      <td style={{ fontFamily: "var(--font-mono)", fontSize: 12, color: "var(--text-muted)" }}>{entry.angkatan}</td>
                      <td><span className={`score-badge ${scoreClass}`}>{entry.numiScore}</span></td>
                      {entry.domainScores.map((s, idx) => {
                        const mId = MODULES[idx].id;
                        const att = entry.quizAttempts && entry.quizAttempts[mId] ? entry.quizAttempts[mId] : 1;
                        return (
                          <td key={idx} style={{ textAlign: "center", fontFamily: "var(--font-mono)", fontSize: 12, color: s >= 4 ? "var(--green)" : s >= 3 ? "var(--yellow)" : "var(--red)" }}>
                            <div style={{ display: "flex", justifyContent: "center", alignItems: "center", gap: 4 }}>
                              <span>{s}/5</span>
                              <span title={`${att}x percobaan`} style={{ display: "inline-flex", alignItems: "center", justifyContent: "center", width: 14, height: 14, borderRadius: "50%", background: "var(--bg-card)", border: "1px solid var(--border)", fontSize: 9, color: "var(--text-muted)", cursor: "help", fontWeight: "normal" }}>i</span>
                            </div>
                          </td>
                        );
                      })}
                      <td style={{ fontSize: 12, color: "var(--text-muted)", fontFamily: "var(--font-mono)", whiteSpace: "nowrap" }}>{entry.timestamp}</td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
          <div style={{ display: "flex", gap: 12, marginTop: 28, flexWrap: "wrap" }}>
            <button onClick={exportData} style={{ display: "inline-flex", alignItems: "center", gap: 8, padding: "12px 24px", borderRadius: 10, border: "none", cursor: "pointer", fontFamily: "var(--font-mono)", fontSize: 12, letterSpacing: "0.05em", textTransform: "uppercase", transition: "all 0.2s", fontWeight: 500, background: "var(--accent)", color: "#fff" }}>

    // ========== MAIN APP ==========
    function BiostatisticsLab() {
      const [identity, setIdentity] = React.useState(null);
      const [active, setActive] = React.useState("identitas"); const [sidebar, setSidebar] = React.useState(false); const [showQuiz, setShowQuiz] = React.useState(false); const [scores, setScores] = React.useState({}); const [quizAttempts, setQuizAttempts] = React.useState({}); const [finalMode, setFinalMode] = React.useState(false); const [fAnswers, setFAnswers] = React.useState([]); const [fDone, setFDone] = React.useState(false); const [fCur, setFCur] = React.useState(0); const [fSel, setFSel] = React.useState(null); const [fExp, setFExp] = React.useState(false); const [finalAttempts, setFinalAttempts] = React.useState(1);
      const completed = Object.keys(scores).length; const allDone = completed === MODULES.length;
      const onSectionDone = (id) => (s, t) => {
        setScores(prev => ({ ...prev, [id]: { score: s, total: t } }));
        setQuizAttempts(prev => ({ ...prev, [id]: (prev[id] || 0) + 1 }));
      };
      const shuffled = React.useMemo(() => { const a = [...FINAL_QUIZ]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1));[a[i], a[j]] = [a[j], a[i]]; } return a; }, [finalMode]);
      const fPick = (i) => { if (fExp) return; setFSel(i); setFExp(true); setFAnswers([...fAnswers, i]); };
      const fNext = () => { if (fCur + 1 >= shuffled.length) setFDone(true); else { setFCur(fCur + 1); setFSel(null); setFExp(false); } };
      const startFinal = () => { setFinalMode(true); setFDone(false); setFAnswers([]); setFCur(0); setFSel(null); setFExp(false); };
      const handleNextModule = () => {
        const curIdx = MODULES.findIndex(m => m.id === active);
        if (curIdx < MODULES.length - 1) {
          setActive(MODULES[curIdx + 1].id);
          setShowQuiz(false);
        } else {
          startFinal();
        }
      };
      const Comps = { descriptive: DescriptiveModule, distributions: DistributionsModule, probability: ProbabilityModule, hypothesis: HypothesisModule, diagnostic: DiagnosticModule, study: StudyModule };
      const cur = MODULES.find(m => m.id === active);
      return (
        <div style={S.root}>
          <style>{`
      :root {

      .site-header .logo span { color: var(--accent); }

      .tab-nav::-webkit-scrollbar { display: none; }

      .rank-1 { background: rgba(212,168,67,0.2); color: var(--yellow); }
      .rank-2 { background: rgba(165,180,200,0.15); color: #A5B4C8; }
      .rank-3 { background: rgba(149,117,90,0.18); color: #B08060; }

      .score-badge { display: inline-flex; align-items: center; padding: 4px 10px; border-radius: 6px; font-family: var(--font-mono); font-size: 13px; font-weight: 500; }
      .score-high { background: var(--green-dim); color: var(--green); }
      .score-mid { background: var(--yellow-dim); color: var(--yellow); }
      .score-low { background: var(--red-dim); color: var(--red); }
      .empty-state { text-align: center; padding: 60px 24px; color: var(--text-muted); font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.05em; }
      .empty-state .es-icon { font-size: 40px; margin-bottom: 12px; }
      @media (max-width: 600px) { .site-header { padding: 0 16px; } .tab-nav { padding: 0 8px; } }
      `}</style>

          <header className="site-header">
            <div className="logo">SMART-MATH <span>MEDICS</span></div>

          <nav className="tab-nav">

                <button

                >
                  <span className="tab-num">{idx + 2}</span> {m.title}

              )
            })}
            <button
              onClick={() => { if (!allDone || !identity) return; startFinal(); setActive("final"); }}
              className={`tab-btn ${finalMode && active !== "leaderboard" ? 'active' : ''} ${(!allDone || !identity) ? 'locked' : ''}`}
            >
              <span className="tab-num">{MODULES.length + 2}</span> UJIAN AKHIR
            </button>
            <button
              onClick={() => { if (!identity) return; setActive("leaderboard"); setFinalMode(false); setShowQuiz(false); }}
              className={`tab-btn ${active === "leaderboard" ? 'active' : ''} ${!identity ? 'locked' : ''}`}
            >
              <span className="tab-num">{MODULES.length + 3}</span> PAPAN SKOR
            </button>
          </nav>
          <div style={S.content}>
            {active === "identitas" ? (
              <IdentityForm onStart={(data) => { setIdentity(data); setActive("descriptive"); }} identity={identity} />
            ) : active === "leaderboard" ? (
              <Leaderboard />
            ) : finalMode ? (<div><h2 style={S.moduleTitle}>🏆 Ujian Akhir — NUMi</h2>
              {!allDone ? (<div style={{ textAlign: "center", padding: 32 }}><div style={{ fontSize: 48, marginBottom: 16 }}>🔒</div><div style={{ fontSize: 16, fontWeight: 600, color: "var(--text-primary)", marginBottom: 8 }}>Selesaikan Semua Kuis Bab Terlebih Dahulu</div><div style={{ fontSize: 13, color: "var(--text-secondary)", marginBottom: 20, lineHeight: 1.5 }}>{completed}/6 selesai.</div><div style={{ display: "flex", flexDirection: "column", gap: 6, maxWidth: 280, margin: "0 auto" }}>{MODULES.filter(m => !scores[m.id]).map(m => <button key={m.id} onClick={() => { setActive(m.id); setFinalMode(false); setShowQuiz(false); }} style={{ ...S.chip, textAlign: "left", padding: "10px 14px" }}>{m.icon} {m.title}</button>)}</div></div>
              ) : fDone ? <FinalExamHasils answers={fAnswers} questions={shuffled} identityData={identity} finalAttempts={finalAttempts} onRetry={() => { startFinal(); setFinalAttempts(prev => prev + 1); }} onViewLeaderboard={() => { setActive("leaderboard"); setFinalMode(false); setShowQuiz(false); }} quizAttempts={quizAttempts} /> : (<div>

                <div style={{ display: "flex", gap: 4, marginBottom: 16 }}>{shuffled.map((_, i) => <div key={i} style={{ flex: 1, height: 4, borderRadius: 2, background: i < fAnswers.length ? (fAnswers[i] === shuffled[i].correct ? "var(--green)" : "var(--red)") : i === fCur ? "var(--accent)" : "var(--border)" }} />)}</div>

                <div style={{ display: "flex", flexDirection: "column", gap: 8, marginBottom: 16 }}>{shuffled[fCur].options.map((opt, i) => { let bg = "var(--bg-card)", border = "var(--border)", color = "var(--text-primary)"; if (fExp) { if (i === fSel) { if (i === shuffled[fCur].correct) { bg = "#122E1B"; border = "var(--green)"; color = "var(--green)"; } else { bg = "#2E1216"; border = "var(--red)"; color = "var(--red)"; } } } else if (i === fSel) { bg = "var(--bg-accent)"; border = "var(--accent)"; } return <button key={i} onClick={() => fPick(i)} style={{ display: "flex", alignItems: "center", gap: 10, padding: "12px 14px", borderRadius: 8, border: `1.5px solid ${border}`, background: bg, color, fontSize: 13, cursor: fExp ? "default" : "pointer", textAlign: "left", fontFamily: "var(--font-body)", transition: "all 0.2s", lineHeight: 1.4 }}><span style={{ fontFamily: "var(--font-mono)", fontWeight: 700, fontSize: 12, opacity: 0.6, flexShrink: 0 }}>{String.fromCharCode(65 + i)}</span>{opt}{fExp && i === fSel && i === shuffled[fCur].correct && <span style={{ marginLeft: "auto" }}>✓</span>}{fExp && i === fSel && i !== shuffled[fCur].correct && <span style={{ marginLeft: "auto" }}>✗</span>}</button>; })}</div>

                {fExp && <button onClick={fNext} style={{ ...btnStyle, background: "var(--accent)", width: "100%" }}>{fCur + 1 >= shuffled.length ? "Lihat Skor NUMi" : "Pertanyaan Berikutnya →"}</button>}
              </div>)}
            </div>) : (<div>
              <h2 style={S.moduleTitle}>{cur.icon} {cur.title}</h2>
              {!showQuiz ? (<><LessonContent moduleId={active} /><div style={{ fontSize: 11, textTransform: "uppercase", letterSpacing: 1.5, color: "var(--accent)", fontFamily: "var(--font-mono)", marginBottom: 12, paddingTop: 4, borderTop: "1px solid var(--border)" }}>🧪 Eksplorasi Interaktif</div>{(() => { const C = Comps[active]; return C ? <C /> : null; })()}<div style={{ marginTop: 24, textAlign: "center", display: "flex", flexDirection: "column", alignItems: "center", gap: 8 }}><button disabled={(quizAttempts[active] || 0) >= 3} onClick={() => setShowQuiz(true)} style={{ ...btnStyle, background: scores[active] ? "var(--bg-card)" : "var(--accent)", border: scores[active] ? "1px solid var(--border)" : "none", color: (quizAttempts[active] || 0) >= 3 ? "var(--text-muted)" : (scores[active] ? "var(--text-secondary)" : "#fff"), padding: "12px 28px", fontSize: 14, cursor: (quizAttempts[active] || 0) >= 3 ? "not-allowed" : "pointer" }}>{scores[active] ? `↻ Ulangi Kuis (${(quizAttempts[active] || 1) - 1}/2)` : "📝 Mulai Kuis Bab"}</button></div></>) : (<><div style={{ marginBottom: 12 }}><button onClick={() => setShowQuiz(false)} style={{ background: "none", border: "none", color: "var(--accent)", cursor: "pointer", fontSize: 13, fontFamily: "var(--font-mono)", padding: 0 }}>← Kembali ke materi</button></div><Quiz questions={SECTION_QUIZZES[active]} onComplete={onSectionDone(active)} title={`${cur.title} Quiz`} onNext={handleNextModule} attemptCount={quizAttempts[active] || 0} onRetry={() => setShowQuiz(false)} /></>)}
            </div>)}
          </div>
        </div>
      );
    }

    const S = {
      root: { fontFamily: "var(--font-body)", background: "var(--bg)", backgroundImage: "radial-gradient(ellipse 80% 50% at 20% -20%, rgba(79,142,247,0.06) 0%, transparent 60%), radial-gradient(ellipse 60% 40% at 80% 110%, rgba(91,192,136,0.04) 0%, transparent 60%)", color: "var(--text-primary)", minHeight: "100vh", position: "relative" },
      /* Removed header and tab styles as they are now in <style> tag */
      content: { maxWidth: 860, margin: "0 auto", padding: "40px 24px 80px" }, moduleTitle: { fontSize: 20, fontWeight: 700, marginBottom: 16, letterSpacing: -0.3 },
      intro: { fontSize: 14, lineHeight: 1.7, color: "var(--text-secondary)", marginBottom: 16 },

      sliderLabel: { display: "block", fontSize: 12, color: "var(--text-muted)", marginBottom: 4, fontFamily: "var(--font-mono)" }, slider: { width: "100%", marginBottom: 12 },
      statRow: { display: "flex", gap: 8, marginBottom: 12, marginTop: 12, flexWrap: "wrap" },
      table: { width: "100%", borderCollapse: "collapse", fontSize: 13, fontFamily: "var(--font-mono)", marginBottom: 4 },

  </script>
